# Dev toolchain for Rust, WASM, web, and help.
[tools]
# Rust 2024 workspace; include the browser WASM target.
rust = { version = "1.93.0", targets = "wasm32-unknown-unknown", components = "rustfmt,clippy,llvm-tools-preview" }
# JS runtime/package manager used by web and help.
bun = "1.3.11"
# Runtime required by Astro and the pinned provider deployment CLIs.
node = "22.13.0"
# WASM build tools used by web/scripts/build-wasm.sh.
"cargo:wasm-pack" = "0.15.0"
"cargo:wasm-bindgen-cli" = "0.2.108"
"cargo:cargo-llvm-cov" = "0.9.0"
"cargo:cargo-audit" = "0.22.2"
"aqua:rhysd/actionlint" = "1.7.12"
# Local supported dependency reports; keep in sync with dependency_scan.py.
"aqua:aquasecurity/trivy" = "0.74.0"

[env]
# Keep tool output readable in local terminals and CI logs.
CARGO_TERM_COLOR = "always"
# Prefer local Stagehand/browser automation over Playwright defaults.
STAGEHAND_ENV = "LOCAL"
# Default docs path consumed by the Vite web app.
VITE_HELP_URL = "/help/"

# Project shortcuts; run with `mise run <name>` or `mise <name>`.
[tasks.setup]
description = "Install local dependencies."
run = [
  "bun install --cwd web --frozen-lockfile",
  "bun install --cwd web/help --frozen-lockfile",
]

[tasks.doctor]
description = "Check local developer toolchain and common setup issues."
run = "python3 scripts/dev/doctor.py"

[tasks."dx:verify"]
description = "Check AGENTS/docs structure, supported lockfiles, and deployment policy."
run = "python3 scripts/dev/verify_dx.py"

[tasks.fmt]
description = "Format Rust code."
run = "cargo fmt --all"

[tasks.lint]
description = "Run CI-style Rust linting."
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run Rust tests."
run = "cargo test --all-features"

[tasks.coverage]
description = "Generate and enforce production-only Rust line coverage."
run = "python3 scripts/dev/rust_coverage.py"

[tasks.audit]
description = "Enforce the reviewed RustSec dependency policy."
run = "python3 scripts/dev/rustsec_audit.py"

[tasks."security:scan"]
description = "Report supported locked dependencies against a current vulnerability database."
run = "python3 scripts/dev/dependency_scan.py"

[tasks.check]
description = "Run Rust format, lint, and tests."
depends = ["verify:rust"]

[tasks.verify]
description = "Run the full local verification gate."
depends = ["verify:rust", "web:build:site", "dx:verify", "workflow:check"]

[tasks."workflow:check"]
description = "Test release policy and lint GitHub Actions workflows."
depends = ["workflow:policy", "workflow:lint"]

[tasks."workflow:policy"]
description = "Reject mutable release inputs, Rust CI compiler drift, and excessive permissions."
run = [
  "python3 scripts/dev/test_retirement.py",
  "python3 scripts/dev/test_ci_triggers.py",
  "python3 scripts/dev/test_rust_coverage.py",
  "python3 scripts/dev/test_rustsec_audit.py",
  "python3 scripts/dev/test_dependency_scan.py",
  "python3 scripts/dev/test_workflow_policy.py",
  "python3 scripts/dev/test_merge_gate.py",
  "python3 scripts/dev/workflow_policy.py",
  "python3 scripts/dev/test_changelog.py",
  "python3 scripts/dev/test_changelog_workflow.py",
]

[tasks."workflow:lint"]
description = "Lint every active GitHub Actions workflow."
run = "actionlint -config-file .github/actionlint.yaml .github/workflows/*.yml"

[tasks."verify:rust"]
description = "Run Rust format, lint, and tests."
depends = ["fmt-check", "lint", "test"]

[tasks."fmt-check"]
description = "Check Rust formatting."
run = "cargo fmt --all -- --check"

[tasks."web:dev"]
description = "Start the web app."
dir = "web"
run = "bun run dev"

[tasks."web:typecheck"]
description = "Type-check the web app."
dir = "web"
run = "bun run typecheck"

[tasks."web:build"]
description = "Build WASM and app-only web/dist (clears existing help)."
dir = "web"
run = ["bun run build:wasm", "bun run typecheck", "bun run build"]

[tasks."web:build:site"]
description = "Build and verify the complete static app with English and Arabic help."
run = "bash web/scripts/build-site.sh"

[tasks."web:test:smoke"]
description = "Run web smoke tests."
dir = "web"
run = "bun run test:e2e:smoke"

[tasks."changelog:generate"]
description = "Refresh committed changelogs from origin/main and published GitHub releases."
run = '''
set -eu
if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
  git fetch --unshallow origin
fi
git fetch origin '+refs/heads/main:refs/remotes/origin/main' --tags
mkdir -p target/changelog
gh api --paginate --slurp 'repos/connectedloops/safeparts/releases?per_page=100' > target/changelog/releases.json
python3 scripts/dev/changelog.py --main-ref origin/main --releases-json target/changelog/releases.json
'''

[tasks."desktop:build"]
description = "Build the experimental Qt desktop text round-trip app."
run = [
  "cmake -S apps/desktop -B target/desktop-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON",
  "cmake --build target/desktop-build -j2",
]

[tasks."desktop:test"]
description = "Run the generated-CXX and Qt desktop action checks."
run = [
  "crates/safeparts_desktop_bridge/scripts/policy_guard.sh",
  "cmake -S apps/desktop -B target/desktop-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON",
  "cmake --build target/desktop-build -j2",
  "ctest --test-dir target/desktop-build --output-on-failure",
]

[tasks."desktop:package:local"]
description = "Build and inspect a local ad-hoc-signed Apple-silicon app bundle."
run = "python3 apps/desktop/scripts/package_macos.py --build-dir target/desktop-package-work --output-dir target/desktop-package"

[tasks."desktop:package:smoke"]
description = "Run bounded development-host relocation evidence for the exact local bundle."
run = "python3 apps/desktop/scripts/smoke_macos_package.py --package-dir target/desktop-package --evidence-dir target/desktop-package-smoke"

[tasks."desktop:package:licenses"]
description = "Assemble offline local license and provenance material for the deployed closure."
run = "python3 apps/desktop/scripts/package_license_material.py --package-dir target/desktop-package --cache-dir target/desktop-license-cache --output-dir target/desktop-license-material"

[tasks."desktop:package:workflows"]
description = "Drive representative synthetic workflows through the relocated packaged app."
run = "python3 apps/desktop/scripts/run_package_workflows.py --package-dir target/desktop-package --evidence-dir target/desktop-package-workflows"

[tasks."desktop:evidence:capacity"]
description = "Run a named desktop capacity case in a fresh process with macOS memory gates."
run = "apps/desktop/scripts/run_capacity_evidence.sh ${CAPACITY_CASE:-maximum-words}"

[tasks."desktop:run"]
description = "Build and launch the experimental Qt desktop app on the development host."
run = "apps/desktop/run.sh"

[tasks."docs:dev"]
description = "Start the help docs."
dir = "web/help"
run = "bun run dev"

[tasks."docs:build"]
description = "Replace web/dist/help with English and Arabic help only."
dir = "web/help"
run = "bun run build"
