name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for naming (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  test:
    name: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate release version
        run: python3 scripts/release/check-version.py "${{ env.RELEASE_VERSION }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: '1.93.0'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --all-features

  build:
    name: build (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            id: linux
          - os: blacksmith-4vcpu-windows-2025
            id: windows
          - os: blacksmith-6vcpu-macos-15
            id: macos-x86_64
            target: x86_64-apple-darwin
            arch: x86_64
          - os: blacksmith-6vcpu-macos-15
            id: macos-aarch64
            target: aarch64-apple-darwin
            arch: aarch64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: '1.93.0'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Rust target (if needed)
        if: matrix.target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p safeparts -p safeparts_tui --target ${{ matrix.target }}
          else
            cargo build --release -p safeparts -p safeparts_tui
          fi

      - name: Package
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            python scripts/release/package.py --version "${{ env.RELEASE_VERSION }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}"
          else
            python scripts/release/package.py --version "${{ env.RELEASE_VERSION }}" --arch "${{ matrix.arch }}"
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safeparts-${{ matrix.id }}
          path: dist/release/*
          if-no-files-found: error

  assemble:
    name: assemble
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - build
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          out_dir = Path('dist/release')
          published_suffixes = ('.tar.gz', '.zip')
          files = sorted(
              p
              for p in out_dir.rglob('*')
              if p.is_file() and p.name.endswith(published_suffixes)
          )
          names = [p.name for p in files]
          if not files:
              raise RuntimeError('release archives must not be empty')
          if len(names) != len(set(names)):
              raise RuntimeError('published release asset names must be unique')

          def sha256_hex(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          sums = out_dir / 'SHA256SUMS.txt'
          with sums.open('w', encoding='utf-8') as f:
              for p in files:
                  f.write(f"{sha256_hex(p)}  {p.name}\n")
          print(f"wrote {sums}")
          PY

      - name: Upload assembled release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safeparts-${{ github.event_name == 'workflow_dispatch' && 'release-dry-run' || 'release-candidate' }}-${{ env.RELEASE_VERSION }}
          path: dist/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: assemble
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: safeparts-release-candidate-${{ env.RELEASE_VERSION }}
          path: dist/release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/release/**/*.tar.gz
            dist/release/**/*.zip
            dist/release/SHA256SUMS.txt
