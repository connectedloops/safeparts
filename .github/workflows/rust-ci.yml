name: rust ci

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/safeparts/**'
      - 'crates/safeparts_core/**'
      - 'crates/safeparts_tui/**'
      - 'crates/safeparts_wasm/**'
      - 'scripts/dev/**'
      - 'scripts/release/**'
      - 'mise.toml'
      - 'web/package.json'
      - 'web/scripts/test-wasm.sh'
      - '.github/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/safeparts/**'
      - 'crates/safeparts_core/**'
      - 'crates/safeparts_tui/**'
      - 'crates/safeparts_wasm/**'
      - 'scripts/dev/**'
      - 'scripts/release/**'
      - 'mise.toml'
      - 'web/package.json'
      - 'web/scripts/test-wasm.sh'
      - '.github/**'

jobs:
  workflow_policy:
    name: workflow policy and actionlint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        uses: taiki-e/install-action@v2
        with:
          tool: actionlint@1.7.12

      - name: Test workflow policy seams
        run: |
          python3 scripts/dev/test_retirement.py
          python3 scripts/dev/test_ci_triggers.py
          python3 scripts/dev/test_rust_coverage.py
          python3 scripts/dev/test_rustsec_audit.py
          python3 scripts/dev/test_workflow_policy.py
          python3 scripts/dev/workflow_policy.py

      - name: Lint active GitHub Actions workflows
        run: actionlint -config-file .github/actionlint.yaml .github/workflows/*.yml

  terminal_behavior_hosts:
    name: terminal behavior (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-windows-2025
            id: windows
          - os: blacksmith-6vcpu-macos-15
            id: macos-native
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: '1.93.0'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Record behavioral scope
        shell: bash
        run: |
          echo "Runs existing CLI/TUI tests on ${{ matrix.id }} for relevant Rust/workflow PRs."
          echo "Coverage includes CLI recovery e2e, TUI file save/load/recovery tests, and private-file cleanup tests."
          echo "Linux-only jobs keep fmt, clippy, coverage, and WASM browser tests."
          echo "Focused evidence includes sensitive_output_files_are_owner_only_even_when_overwritten and failed_replace_removes_temporary_output where supported."

      - name: CLI behavior tests
        run: cargo test -p safeparts --all-features

      - name: TUI behavior tests
        run: cargo test -p safeparts_tui --all-features

  rust:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: '1.93.0'
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown

      - name: Install Rust tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0,wasm-pack@0.15.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: WASM browser tests
        run: bash web/scripts/test-wasm.sh

      - name: Production-only coverage
        run: python3 scripts/dev/rust_coverage.py

      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: target/coverage
          if-no-files-found: warn
