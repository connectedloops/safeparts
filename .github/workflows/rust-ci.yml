name: rust ci

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/safeparts/**'
      - 'crates/safeparts_core/**'
      - 'crates/safeparts_tui/**'
      - 'crates/safeparts_wasm/**'
      - 'scripts/dev/**'
      - 'scripts/release/**'
      - 'mise.toml'
      - 'web/package.json'
      - 'web/scripts/test-wasm.sh'
      - '.github/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/safeparts/**'
      - 'crates/safeparts_core/**'
      - 'crates/safeparts_tui/**'
      - 'crates/safeparts_wasm/**'
      - 'scripts/dev/**'
      - 'scripts/release/**'
      - 'mise.toml'
      - 'web/package.json'
      - 'web/scripts/test-wasm.sh'
      - '.github/**'

jobs:
  rust:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown

      - name: Install Rust tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0,wasm-pack@0.15.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check supported workload and release workflow policy
        run: |
          python3 scripts/dev/test_retirement.py
          python3 scripts/dev/test_workflow_policy.py
          python3 scripts/dev/workflow_policy.py

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: WASM browser tests
        run: bash web/scripts/test-wasm.sh

      - name: Production-only coverage
        run: python3 scripts/dev/rust_coverage.py

      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: target/coverage
          if-no-files-found: warn
