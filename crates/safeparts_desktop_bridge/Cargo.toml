[package]
name = "safeparts_desktop_bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "=1.0.194"
safeparts_core = { path = "../safeparts_core" }
zeroize = "1.8.2"

[build-dependencies]
cxx-build = "=1.0.194"

[lints.rust]
# Sole exception: cxx::bridge emits generated unsafe glue in this package.
unsafe_code = "allow"
